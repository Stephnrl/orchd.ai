name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate contracts
        run: python scripts/validate_contracts.py
      - name: Run offline suite with strict skip accounting
        run: python scripts/ci_tests.py
      - name: Check JavaScript syntax
        run: node --check orch/ui/app.js
      - name: Check approval controls
        run: node tests/test_ui_approval_renewal.cjs
      - name: Check recovery controls
        run: node tests/test_ui_recovery_diagnostics.cjs
      - name: Check maintenance reports
        run: node tests/test_ui_maintenance.cjs
      - name: Check Python compilation
        run: python -m compileall -q orch tests scripts
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  docker:
    name: Docker (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORCH_DOCKER_TEST_IMAGE: python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Preload the approved fixture image
        run: docker pull "$ORCH_DOCKER_TEST_IMAGE"
      - name: Verify all five Docker gates with host-bound evidence
        run: python -m orch verify-runtime --image "$ORCH_DOCKER_TEST_IMAGE" --destination .runtime/ci-runtime.json
