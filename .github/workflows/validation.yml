name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify complete offline acceptance lane
        run: python -m orch verify-release --release-lane offline --destination .runtime/ci-offline-release.json
      - name: Check Python compilation
        run: python -m compileall -q orch tests scripts
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  browser:
    name: Browser (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Python fixture dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check real browser operator workflow
        run: python -m orch verify-release --release-lane browser --destination .runtime/ci-browser-release.json

  docker:
    name: Docker (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORCH_DOCKER_TEST_IMAGE: python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Preload the approved fixture image
        run: docker pull "$ORCH_DOCKER_TEST_IMAGE"
      - name: Verify all five Docker gates with host-bound evidence
        run: python -m orch verify-runtime --image "$ORCH_DOCKER_TEST_IMAGE" --destination .runtime/ci-runtime.json
      - name: Verify pilot container workers and interrupted-container recovery
        run: python scripts/pilot_worker_acceptance.py --image "$ORCH_DOCKER_TEST_IMAGE" --destination .runtime/ci-pilot-workers.json
      - name: Verify task-kernel repository approval and recovery with Docker
        run: python scripts/repository_task_acceptance.py --image "$ORCH_DOCKER_TEST_IMAGE"
